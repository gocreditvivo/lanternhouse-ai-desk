name: Linh Safe Audit Fix

on:
  push:
    branches:
      - chatgpt/linh-falls-church-pilot-testmode-20260816

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'chore(deps): apply safe npm audit lockfile fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/linh-falls-church-pilot-testmode-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit fix --package-lock-only
      - name: Commit safe lockfile changes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No safe lockfile changes available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): apply safe npm audit lockfile fixes"
          git push origin HEAD:chatgpt/linh-falls-church-pilot-testmode-20260816
