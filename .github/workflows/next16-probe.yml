name: Next 16 Probe

on:
  push:
    branches:
      - chatgpt/linh-next16-probe-20260816

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --workspace web next@16.3.1 eslint-config-next@16.3.1 --no-save
      - run: npm --workspace web test
      - run: npm --workspace web run typecheck
      - run: npm --workspace web run lint
      - run: npm --workspace web run build
      - run: npm audit --omit=dev --audit-level=high
