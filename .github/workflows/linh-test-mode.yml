name: Linh Test Mode Verification

on:
  push:
    branches:
      - chatgpt/linh-falls-church-pilot-testmode-20260816
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --workspace web test
      - run: npm --workspace web run typecheck
      - run: npm --workspace web run lint
      - run: npm --workspace web run build
      - run: npm audit --omit=dev --audit-level=high
